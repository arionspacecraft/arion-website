name: Deploy ARION to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      notion_state: ${{ steps.build.outputs.notion_state }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test motion preferences and publication filter
        run: npm test
      - name: Build and prepare route entry pages
        id: build
        run: npm run build
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}/
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: Require successful Notion sync for branch validation
        if: github.ref != 'refs/heads/main' && steps.build.outputs.notion_state != 'ready'
        run: exit 1
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Report unavailable project sync after safe deployment
        if: needs.build.outputs.notion_state != 'ready'
        run: |
          echo "::error::Notion sync failed. An empty project list was deployed; check the integration and NOTION_TOKEN."
          exit 1
